[project]
name = "yolo-ex"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "inference-sdk>=1.5.2",
    "matplotlib>=3.11.1",
    "opencv-python>=4.11.0.86",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "roboflow>=1.4.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.142",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
